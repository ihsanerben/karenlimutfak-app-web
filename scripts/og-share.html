<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <style>
      * { box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; margin: 0; }
      body { display: grid; grid-template-columns: 500px 700px; overflow: hidden; background: #faf7f0; }
      .brand { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 42px; }
      .mark { width: 180px; height: 180px; overflow: hidden; border-radius: 50%; background: #a56336; }
      .mark img { display: block; width: 100%; height: 100%; object-fit: cover; transform: scale(1.34); }
      h1 { margin: 0; color: #293d31; font: 600 56px/1.1 Georgia, serif; letter-spacing: -2.5px; }
      .photo { width: 700px; height: 630px; object-fit: cover; object-position: center 56%; }
    </style>
  </head>
  <body>
    <div class="brand">
      <div class="mark"><img src="../public/logo-small.jpeg" alt="" /></div>
      <h1>Karenli Mutfak</h1>
    </div>
    <img class="photo" src="../public/images/pogaca-hero.webp" alt="" />
  </body>
</html>
